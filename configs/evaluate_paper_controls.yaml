    enabled: true
    model_type: MULTICOND
    regime: train_all_s013
    label: "train-all (S0,S1,S3) MULTICOND"
    training_config: configs/train_self_recorded_multicond.yaml
    preprocessing_variant: non_interpolated
    evaluation_subjects: [0, 1, 3]
