version: 1
run_id: paper_controls_s013

paths:
  smb_root: "/run/user/1001/gvfs/smb-share:server=140.116.245.43,share=stubackups/43備份/stubackup/博堯"
  checkpoint_root: "/run/user/1001/gvfs/smb-share:server=140.116.245.43,share=stubackups/43備份/stubackup/博堯/詹博堯/eeg_outputs_backup"
  checkpoint_staging_dir: outputs/paper_controls_checkpoints
  raw_cdt_staging_dir: data/paper_controls/raw_cdt
  processed_non_interpolated_dir: data/paper_controls/SelfRecorded_EEG_Processed
  processed_interpolated_dir: data/paper_controls/SelfRecorded_EEG_Processed_Interpolated
  target_audio_smb_dir: "/run/user/1001/gvfs/smb-share:server=140.116.245.43,share=stubackups/43備份/stubackup/博堯/詹博堯/wav_16k"
  target_audio_dir: data/paper_controls/wav_16k
  stems_root: data/paper_controls/separated/htdemucs
  output_root: results/paper_controls

raw_subjects:
  - {subject: S0, index: 0, directory: 20260519_Chris_128Channels}
  - {subject: S1, index: 1, directory: 20260522_Bryan_128Channels}
  - {subject: S2, index: 2, directory: 20260602_i_128Channels}
  - {subject: S3, index: 3, directory: 20260605_Hua_128Channels}

preprocessing:
  songs: [song3, song6, song7, song9, song10]
  conditions: [drum, vocal, guitar, passive]
  keep_eeg_channels: 128
  dst_fs: 1000
  trim_to_shortest: true
  center_using_first_samples: 1000
  robust_scale: true
  interpolated_disconnected_impedance_value: 250000
  interpolated_auto_bad_impedance_threshold: 100000
  max_auto_bad_fraction: 0.5
  regression_tolerance: 0.01

evaluation:
  split: ood_test
  target_songs: [song7]
  target_chunks: {start: 0, stop: 48}
  prompt: "Pop music"
  model_id: cvssp/audioldm2-music
  chunk_sec: 3.5
  sample_rate: 16000
  num_inference_steps: 25
  guidance_scale: 3.5
  eta: 0.0
  generation_seed: 42
  generation_replicates: 1
  max_samples: null

# Archived correct generations used one global RNG stream with batch size 2.
# This protocol is only for preprocessing/checkpoint regression; paper controls
# below use stable per-target generators shared by correct/shuffled/pretrained.
legacy_regression:
  generation_seed: 42
  batch_size: 2
  latent_grid: [8, 87, 16]

shuffle:
  num_permutations: 10
  seed: 0
  min_chunk_distance: 5
  same_subject: true
  same_song: true
  on_failure: error

# Cross-song shuffled EEG: same participant/attention condition, source EEG
# drawn from a different song. Mirrors `shuffle` (same num_permutations by
# default) but the pairing constraint is same_song=false, different_song=true.
cross_song:
  enabled: true
  num_permutations: 10
  mapping_seed: 0
  on_failure: error

# Temporal-shift curve: same participant/song, fixed signed chunk offset.
# offset 0 is equivalent to `correct` and is never (re)generated; it is read
# back from the correct manifest at analysis time. Positive offset uses EEG
# recorded later than the target audio chunk (source_index = target + offset).
temporal_shift:
  enabled: true
  offsets: [-10, -5, -2, -1, 0, 1, 2, 5, 10]
  include_random_within_song: true
  analysis_mode: common_support  # common_support | max_available

stems:
  drum: drums
  guitar_proxy_other_bass: guitar_proxy_other_bass
  vocal: vocals
  source_components:
    guitar_proxy_other_bass: [other, bass]

bootstrap:
  num_resamples: 10000
  seed: 0

runtime:
  device: cuda
  require_cuda_for_generation: true
  stage_checkpoints: true
  verify_checkpoint_sha256: true
  overwrite_outputs: false
  config_overrides:
    data:
      eeg_chunk_cache_dir: null
      batch_size: 1
      num_workers: 0
    latent_cache:
      enabled: false

smb_inventory:
  # These paths are resolved relative to each checkpoint's parent directory.
  archived_result: result.json

regression_references:
  multicond_train_all_s013: {num_rows: 144, mean_clap: 0.5945044623480903}
  passive3_train_all_s013: {num_rows: 144, mean_clap: 0.5264519585503472}
  multicond_loso_s0: {num_rows: 48, mean_clap: 0.6174367268880209}
  passive3_loso_s0: {num_rows: 48, mean_clap: 0.5263621012369791}
  multicond_loso_s1: {num_rows: 48, mean_clap: 0.5012410481770834}
  passive3_loso_s1: {num_rows: 48, mean_clap: 0.49688720703125}

