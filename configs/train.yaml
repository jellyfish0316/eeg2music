seed: 42

experiment:
  conditions: [passive]
  seed: 42

data:
  # Optional multi-song mode for paper-style validation across NMED-T.
  # Keep this null for the current single-song fallback mode.

  songs:
    - name: song21
      mat_path: data/EEG_processed/song21_Processed.mat
      audio_path: data/songs/song21_16k.wav
      data_key: data21
    - name: song22
      mat_path: data/EEG_processed/song22_Processed.mat
      audio_path: data/songs/song22_16k.wav
      data_key: data22
    - name: song23
      mat_path: data/EEG_processed/song23_Processed.mat
      audio_path: data/songs/song23_16k.wav
      data_key: data23
    - name: song24
      mat_path: data/EEG_processed/song24_Processed.mat
      audio_path: data/songs/song24_16k.wav
      data_key: data24
    - name: song25
      mat_path: data/EEG_processed/song25_Processed.mat
      audio_path: data/songs/song25_16k.wav
      data_key: data25
    - name: song26
      mat_path: data/EEG_processed/song26_Processed.mat
      audio_path: data/songs/song26_16k.wav
      data_key: data26
    - name: song27
      mat_path: data/EEG_processed/song27_Processed.mat
      audio_path: data/songs/song27_16k.wav
      data_key: data27
    - name: song28
      mat_path: data/EEG_processed/song28_Processed.mat
      audio_path: data/songs/song28_16k.wav
      data_key: data28
    - name: song29
      mat_path: data/EEG_processed/song29_Processed.mat
      audio_path: data/songs/song29_16k.wav
      data_key: data29
    - name: song30
      mat_path: data/EEG_processed/song30_Processed.mat
      audio_path: data/songs/song30_16k.wav
      data_key: data30

  eeg_time: 3500
  audio_samples: 56000
  chunk_sec: 3.5
  eeg_fs: 1000
  audio_fs: 16000
  batch_size: 2
  num_workers: 0
  text_prompt: "Pop music"
  eeg_chunk_cache_dir: data/precomputed/eeg_chunks_1khz


model:
  use_subject_adapter: true
  subject_emb_dim: 64
  projector:
    channels: [256, 512, 1024, 2048]
    strides: [5, 2, 2, 2]
    lat_grid: null
  unet:
    cache_pipeline: true
    text_cache_path: data/precomputed/audioldm2_text_pop_music.pt

audio_encoder:
  model_id: cvssp/audioldm2-music
  sample_rate: 16000
  freeze_vae: true
  use_mode: true # true: deterministic, false: random latents

controlnet:
  enabled: true
  control_scale: 1.0
  freeze_base_unet: true
  copy_encoder_weights: true
  inject_middle_block: true
  zero_init: true
  # conditioning_mode options:
  # repo: following the controlnet's repo and paper, putting zero conv on conditioning
  # paper: following the eeg paper, putting zero conv on zt
  conditioning_mode: paper
  trainable_modules:
    - subject_adapter
    - projector
    - control_branch

latent_cache: 
  enabled: true
  path: data/precomputed/nmedt_audioldm2_latents_paperaligned_v4.pt
  latent_channels: 8
  precompute_batch_size: 16
  precompute_use_mode: true

diffusion:
  num_train_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

split:
  # Optional zero-based dataset subject subset.
  # For a paper-style single-subject run, set e.g. [1] if your mats store "subject 2"
  # at dataset index 1.
  subject_indices: [1] # subject 2
  val_ratio: 0.1
  # Keep all songs in data.songs. OOD should be controlled here, not by deleting songs.
  song_splits:
    train: [song22, song23, song24, song25, song26, song27, song28, song29, song30]
    val: [song22, song23, song24, song25, song26, song27, song28, song29, song30]
    test: [song22, song23, song24, song25, song26, song27, song28, song29, song30]
  ood_song_splits:
    ood_test: [song21]
  chunk_splits:
    train: [0.0, 0.8]
    val: [0.8, 0.9]
    test: [0.9, 1.0]
    ood_test: [0.0, 1.0]

train:
  device: cuda
  model_dtype: float32
  lr: 0.0001
  epochs: 20
  gradient_accumulation_steps: 3
  grad_clip: 1.0
  log_every: 10
  validation_metric: clap
  validation_num_inference_steps: 25
  validation_generate_batches: 4
  best_checkpoint_name: best_model.pt
  output_root: outputs/paperaligned_subject2
  checkpoint_name: model.pt
