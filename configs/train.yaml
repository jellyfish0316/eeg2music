seed: 42

experiment:
  active_instruments: [drum, guitar, vocal]
  conditions: [passive_x3]
  seed: 42
  num_folds: 10
  fold_index: 0

data:
  # Default fallback source (used when condition_sources missing keys)
  mat_path: data/EEG_processed/song22_Processed.mat
  audio_path: data/songs/song22_16k.wav
  data_key: data22

  # Optional multi-song mode for paper-style validation across NMED-T.
  # Keep this null for the current single-song fallback mode.

  songs:
    - name: song22
      mat_path: data/EEG_processed/song22_Processed.mat
      audio_path: data/songs/song22_16k.wav
      data_key: data22
    - name: song23
      mat_path: data/EEG_processed/song23_Processed.mat
      audio_path: data/songs/song23_16k.wav
      data_key: data23
    - name: song24
      mat_path: data/EEG_processed/song24_Processed.mat
      audio_path: data/songs/song24_16k.wav
      data_key: data24
    - name: song25
      mat_path: data/EEG_processed/song25_Processed.mat
      audio_path: data/songs/song25_16k.wav
      data_key: data25
    - name: song26
      mat_path: data/EEG_processed/song26_Processed.mat
      audio_path: data/songs/song26_16k.wav
      data_key: data26
    - name: song27
      mat_path: data/EEG_processed/song27_Processed.mat
      audio_path: data/songs/song27_16k.wav
      data_key: data27
    - name: song28
      mat_path: data/EEG_processed/song28_Processed.mat
      audio_path: data/songs/song28_16k.wav
      data_key: data28
    - name: song29
      mat_path: data/EEG_processed/song29_Processed.mat
      audio_path: data/songs/song29_16k.wav
      data_key: data29
    - name: song30
      mat_path: data/EEG_processed/song30_Processed.mat
      audio_path: data/songs/song30_16k.wav
      data_key: data30

  # Leave condition_sources unset for now so each song falls back to its own
  # mat_path/data_key. We can wire condition-specific sources later.
  condition_sources: null
  # Condition-specific EEG sources; replace with your own files/keys.
  # condition_sources:
  #   passive:
  #     mat_path: data/EEG/song21_Imputed.mat
  #     data_key: data21
  #   drum:
  #     mat_path: data/EEG/song21_Imputed.mat
  #     data_key: data21
  #   guitar:
  #     mat_path: data/EEG/song21_Imputed.mat
  #     data_key: data21
  #   vocal:
  #     mat_path: data/EEG/song21_Imputed.mat
  #     data_key: data21
  
  eeg_time: 3500
  audio_samples: 56000
  chunk_sec: 3.5
  eeg_fs: 1000
  audio_fs: 16000
  batch_size: 4
  num_workers: 0
  text_prompt: "Pop music"


model:
  use_subject_adapter: true
  subject_emb_dim: 64
  projector:
    channels: [256, 512, 1024, 2048]
    strides: [5, 2, 2, 2]
    lat_grid: null
  unet:
    cache_pipeline: true
    text_cache_path: data/precomputed/audioldm2_text_pop_music.pt

audio_encoder:
  model_id: cvssp/audioldm2-music
  sample_rate: 16000
  freeze_vae: true
  use_mode: false

controlnet:
  enabled: true
  control_scale: 1.0
  freeze_base_unet: true
  copy_encoder_weights: true
  inject_middle_block: true
  zero_init: true
  # conditioning_mode options:
  # repo: following the controlnet's repo and paper, putting zero conv on conditioning
  # paper: following the eeg paper, putting zero conv on zt
  conditioning_mode: paper
  trainable_modules:
    - subject_adapter
    - projector
    - control_branch

latent_cache: 
  enabled: true
  path: data/precomputed/nmedt_audioldm2_latents_paperaligned_v4.pt
  latent_channels: 8
  precompute_batch_size: 16
  precompute_use_mode: true

diffusion:
  num_train_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

split:
  loso:
    enabled: false
  val_ratio: 0.1
  chunk_splits:
    train: [0.0, 0.8]
    val: [0.8, 0.9]
    test: [0.9, 1.0]

train:
  device: cuda
  model_dtype: float32
  lr: 0.0001
  epochs: 20
  gradient_accumulation_steps: 4
  grad_clip: 1.0
  log_every: 10
  validation_metric: clap
  validation_num_inference_steps: 25
  validation_generate_batches: 4
  best_checkpoint_name: best_model.pt
  run_mode: single_fold
  output_root: outputs/paperaligned_v4
  checkpoint_name: model.pt
