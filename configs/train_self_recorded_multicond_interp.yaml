      audio_path: data/SelfRecorded_songs/wav_16k/song7.wav
      data_key: data7
      sources:
        guitar:
          mat_path: data/SelfRecorded_EEG_Processed_Interpolated/song7_guitar_Processed.mat
          data_key: data7
        vocal:
          mat_path: data/SelfRecorded_EEG_Processed_Interpolated/song7_vocal_Processed.mat
          data_key: data7
        drum:
          mat_path: data/SelfRecorded_EEG_Processed_Interpolated/song7_drum_Processed.mat
          data_key: data7
    - name: song9
      mat_path: data/SelfRecorded_EEG_Processed_Interpolated/song9_passive_Processed.mat
      audio_path: data/SelfRecorded_songs/wav_16k/song9.wav
      data_key: data9
      sources:
        guitar:
          mat_path: data/SelfRecorded_EEG_Processed_Interpolated/song9_guitar_Processed.mat
          data_key: data9
        vocal:
          mat_path: data/SelfRecorded_EEG_Processed_Interpolated/song9_vocal_Processed.mat
